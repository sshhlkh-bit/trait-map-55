                4: { name: "Співпраця", H: "Ви не любите конфронтацій і готові йти на компроміс заради гармонії.", L: "Ви частіше залякуєте або тиснете на інших, щоб досягти свого." },
                5: { name: "Скромність", H: "Ви не любите стверджувати, що ви кращі за інших.", L: "Ви готові описувати себе як кращих, що може сприйматися як зарозумілість." },
                6: { name: "Співчуття", H: "Ви співчутливі, легко співпереживаєте біль інших і відчуваєте жалість.", L: "Ви пишаєтеся об'єктивними рішеннями на основі розуму, а не милосердя." }
            }
        },
        C: {
            main: { 
                H: "Ваш результат за шкалою Сумлінності високий. Ви організовані, надійні та дисципліновані.", 
                L: "Ваш результат за шкалою Сумлінності низький, що вказує на те, що ви любите жити моментом. Ваша робота може бути недбалою і неорганізованою." 
            },
            f: {
                1: { name: "Самоефективність", H: "Ви вірите, що маєте інтелект і наполегливість, необхідні для досягнення успіху.", L: "Ви не відчуваєте себе ефективними і можете мати відчуття, що не контролюєте своє життя." },
                2: { name: "Організованість", H: "Ви добре організовані, любите жити за розкладом і вести списки.", L: "Ви схильні до неорганізованості та розкиданості." },
                3: { name: "Відповідальність", H: "Ви маєте сильне відчуття морального обов'язку.", L: "Ви вважаєте правила обмежувальними, вас можуть вважати ненадійними." },
                4: { name: "Прагнення до досягнень", H: "Ви прагнете досягти досконалості і маєте сильне відчуття напряму в житті.", L: "Ви задоволені досягненням мінімального рівня роботи." },
                5: { name: "Самодисципліна", H: "Ви здатні наполегливо працювати над складними завданнями до їх завершення.", L: "Ви схильні до прокрастинації та часто не виконуєте завдання." },
                6: { name: "Обачність", H: "Ви обдумуєте можливості та наслідки перед дією.", L: "Ви часто говорите або робите перше, що спадає на думку." }
            }
        }
    };

    function showN(txt) {
        const n = document.getElementById('tgNotif');
        document.getElementById('tgMsg').innerHTML = txt;
        n.classList.add('active');
        setTimeout(() => n.classList.remove('active'), 15000);
    }

    function startTest() {
        const n = document.getElementById('uName').value.trim();
        const p = document.getElementById('uPhone').value.trim();
        if(n.length < 2) return alert("Будь ласка, вкажіть ваше ім'я");
        uName = n; uPhone = p;
        document.getElementById('step-reg').style.display = 'none';
        document.getElementById('step-test').style.display = 'block';
        showN(`Привіт, ${uName}! 👋<br>Оберіть, наскільки ви згодні з твердженнями.`);
        render();
    }

    function render() {
        if(cur >= questions.length) return finish();
        const q = questions[cur];
        document.getElementById('pFill').style.width = (cur / questions.length * 100) + "%";
        let h = `<div class="q-text">${q.text}</div><div class="options">`;
        h += `<button class="opt-btn" onclick="next(1)">Зовсім не згоден</button>`;
        h += `<button class="opt-btn" onclick="next(2)">Скоріше не згоден</button>`;
        h += `<button class="opt-btn" onclick="next(3)">Нейтрально</button>`;
        h += `<button class="opt-btn" onclick="next(4)">Скоріше згоден</button>`;
        h += `<button class="opt-btn" onclick="next(5)">Повністю згоден</button>`;
        document.getElementById('qArea').innerHTML = h + `</div>`;
    }

    function next(val) {
        const q = questions[cur];
        s[q.cat][q.f] += q.rev ? (6 - val) : val;
        cur++; render();
    }

    // Генерація ПОВНОГО тексту для таблиці
    function generateFullReport() {
        let report = "";
        const cats = ["N", "E", "O", "A", "C"];
        
        cats.forEach(c => {
            let sum = s[c][1]+s[c][2]+s[c][3]+s[c][4]+s[c][5]+s[c][6];
            let mainLvl = sum >= 30 ? "H" : "L"; // Більше 50% = Високий
            
            report += `=== ${texts[c].main.title.toUpperCase()} (Бал: ${sum}/60) ===\n`;
            report += texts[c].main[mainLvl] + "\n\n";
            
            for(let i=1; i<=6; i++) {
                let fVal = s[c][i];
                let fLvl = fVal >= 6 ? "H" : "L"; // Макс 10
                let status = fVal >= 6 ? "(Високий)" : "(Низький)";
                report += `• ${texts[c].f[i].name} | Бали: ${fVal}/10 ${status}\n`;
                report += `${texts[c].f[i][fLvl]}\n\n`;
            }
            report += `-------------------------------------------\n\n`;
        });
        return report;
    }

    function finish() {
        document.getElementById('step-test').style.display = 'none';
        document.getElementById('step-final').style.display = 'block';
        
        let sumN = s.N[1]+s.N[2]+s.N[3]+s.N[4]+s.N[5]+s.N[6];
        let sumE = s.E[1]+s.E[2]+s.E[3]+s.E[4]+s.E[5]+s.E[6];
        let sumO = s.O[1]+s.O[2]+s.O[3]+s.O[4]+s.O[5]+s.O[6];
        let sumA = s.A[1]+s.A[2]+s.A[3]+s.A[4]+s.A[5]+s.A[6];
        let sumC = s.C[1]+s.C[2]+s.C[3]+s.C[4]+s.C[5]+s.C[6];

        const d = { 
            name: uName, phone: uPhone, 
            N: sumN, E: sumE, O: sumO, A: sumA, C: sumC,
            fullReport: generateFullReport()
        };
        
        if(WEBHOOK_URL.length > 10) fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(d) });
    }
</script>
